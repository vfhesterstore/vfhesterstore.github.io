<!DOCTYPE html>
<html>
<head>
  <title>Diamond Recharge</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #000;
      color: #fff;
    }
    h1 {
      text-align: center;
      color: #ffffff;
    }
    .item {
      background: #000;
      margin: 10px 0;
      padding: 15px;
      border-radius: 10px;
      border: 2px solid #ffffff;
      box-shadow: 0 0 10px #ffffff55;
    }
    .item span {
      font-weight: bold;
      display: block;
      font-size: 1.2em;
    }
    .cart-btn {
      background: #ffffff;
      color: #000;
      border: none;
      padding: 10px 16px;
      margin-top: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .cart {
      margin-top: 40px;
      padding: 15px;
      border-radius: 10px;
      border: 2px solid #ffffff;
      background: #000;
      box-shadow: 0 0 10px #ffffff55;
    }
    ul {
      padding-left: 18px;
    }
  
    .logo {
      font-size: 1.5em;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 20px;
    }
    .fade-in {
      animation: fadeIn 1s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

</style>
</head>
<body>
<div class="logo fade-in">Diamond Store</div>

  <h1>Diamond Recharge</h1>
  <p id="playerInfo" style="text-align:center;margin-bottom:20px;color:#ffffff;"></p>
  <button class="cart-btn" onclick="goBack()">Back</button>

  <!-- Diamond packs -->
  <div class="item"><span>11💎</span><span class="price">₹20</span><button class="cart-btn" onclick="addToCart('11💎', 20)">Add to Cart</button></div>
  <div class="item"><span>22💎</span><span class="price">₹40</span><button class="cart-btn" onclick="addToCart('22💎', 40)">Add to Cart</button></div>
  <div class="item"><span>44💎</span><span class="price">₹80</span><button class="cart-btn" onclick="addToCart('44💎', 80)">Add to Cart</button></div>
  <div class="item"><span>86💎</span><span class="price">₹120</span><button class="cart-btn" onclick="addToCart('86💎', 120)">Add to Cart</button></div>
  <div class="item"><span>112💎</span><span class="price">₹160</span><button class="cart-btn" onclick="addToCart('112💎', 160)">Add to Cart</button></div>
  <div class="item"><span>172💎</span><span class="price">₹230</span><button class="cart-btn" onclick="addToCart('172💎', 230)">Add to Cart</button></div>
  <div class="item"><span>257💎</span><span class="price">₹330</span><button class="cart-btn" onclick="addToCart('257💎', 330)">Add to Cart</button></div>
  <div class="item"><span>344💎</span><span class="price">₹440</span><button class="cart-btn" onclick="addToCart('344💎', 440)">Add to Cart</button></div>
  <div class="item"><span>706💎</span><span class="price">₹820</span><button class="cart-btn" onclick="addToCart('706💎', 820)">Add to Cart</button></div>
  <div class="item"><span>792💎</span><span class="price">₹940</span><button class="cart-btn" onclick="addToCart('792💎', 940)">Add to Cart</button></div>
  <div class="item"><span>1032💎</span><span class="price">₹1380</span><button class="cart-btn" onclick="addToCart('1032💎', 1380)">Add to Cart</button></div>
  <div class="item"><span>Weekly Diamond Pass</span><span class="price">₹135</span><button class="cart-btn" onclick="addToCart('Weekly Diamond Pass', 135)">Add to Cart</button></div>

  <div class="cart">
    <h2 style="color:#ffffff;">Your Cart</h2>
    <ul id="cartItems"></ul>
    <p>Total: ₹<span id="totalAmount">0</span></p>
    <button class="cart-btn" onclick="payNow()">Pay Now</button>
    <button class="cart-btn" onclick="clearCart()">Clear Cart</button>
  </div>

  <script>
    let cart = [];
    let total = 0;

    function addToCart(item, price) {
      cart.push({ item, price });
      total += price;
      updateCart();
    }

    function updateCart() {
      const cartList = document.getElementById("cartItems");
      const totalSpan = document.getElementById("totalAmount");
      cartList.innerHTML = "";
      cart.forEach(entry => {
        const li = document.createElement("li");
        li.textContent = entry.item + " - ₹" + entry.price;
        cartList.appendChild(li);
      });
      totalSpan.textContent = total;
    }

    function clearCart() {
      cart = [];
      total = 0;
      updateCart();
    }

    function payNow() {
      if (total > 0) {
        const confirmPay = confirm(`Proceed to pay ₹${total}?`);
        if (confirmPay) {
          const upiLink = `upi://pay?pa=winnergame9@oksbi&pn=WinnerGame&am=${total}&cu=INR`;
          window.location.href = upiLink;
        }
      } else {
        alert("Cart is empty.");
      }
    }

    function goBack() {
      window.location.href = "index.html";
    }

    document.addEventListener("DOMContentLoaded", () => {
      const pid = localStorage.getItem("playerId");
      const sid = localStorage.getItem("serverId");
      if (pid && sid) {
        document.getElementById("playerInfo").textContent = `Player ID: ${pid} | Server: ${sid}`;
      } else {
        alert("Player info missing. Redirecting...");
        window.location.href = "index.html";
      }
    });
  </script>
</body>
</html>
