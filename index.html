<!DOCTYPE html>
<html>
<head>
  <title>Welcome - Diamond Recharge</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
    }
    h1 {
      color: #ffffff;
      font-size: 2em;
      margin-bottom: 40px;
    }
    .start-btn {
      padding: 12px 24px;
      background: #ffffff;
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1.1em;
      cursor: pointer;
    }
  
    .logo {
      font-size: 1.5em;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 20px;
    }
    .fade-in {
      animation: fadeIn 1s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

</style>
</head>
<body>
<div class="logo fade-in">Diamond Store</div>

  <h1>vF Hester's Store</h1>
  <button class="start-btn" onclick="window.location.href='player.html'">Mobile Legends Diamond Recharge</button>
</body>
</html>
